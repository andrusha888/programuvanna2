<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Студентські події{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{{ url_for('home') }}" class="brand">Студентські події <span>FLASK</span></a>
            <nav aria-label="Головне меню">
                <a href="{{ url_for('home') }}">Головна</a>
                <a href="{{ url_for('event_list') }}">Події</a>
                <a href="{{ url_for('register') }}">Реєстрація</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="notice" role="status">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer"><div class="container">Навчальний проєкт Flask · {{ current_year }}</div></footer>
</body>
</html>
