{% load static %}
<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Студентські події{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'events/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'home' %}" class="brand">Студентські події <span>DJANGO</span></a>
            <nav aria-label="Головне меню">
                <a href="{% url 'home' %}">Головна</a>
                <a href="{% url 'event_list' %}">Події</a>
                <a href="{% url 'register' %}">Реєстрація</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="notice" role="status">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer"><div class="container">Навчальний проєкт Django · {% now "Y" %}</div></footer>
</body>
</html>
